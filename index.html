<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7d6e0" />
    <meta
      name="description"
      content="Pick a food spot by day, time, location, and cuisine."
    />
    <title>Eat Where</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="app">
      <header class="brand">
        <p class="brand__mark">Eat Where</p>
        <h1 class="brand__headline">Hungry? Let’s settle it.</h1>
        <p class="brand__sub">
          Pick a day, time, area, and cuisine — we’ll pull one spot from your
          list.
        </p>
      </header>

      <section class="picker" aria-label="Food spot filters">
        <div class="field">
          <label for="day">Day</label>
          <select id="day" name="day"></select>
        </div>

        <div class="field">
          <label for="time">Time</label>
          <select id="time" name="time"></select>
        </div>

        <div class="field">
          <label for="location">Location</label>
          <select id="location" name="location"></select>
        </div>

        <div class="field">
          <label for="cuisine">Cuisine</label>
          <select id="cuisine" name="cuisine"></select>
        </div>

        <p class="day-note" id="dayNote" hidden></p>

        <button type="button" class="cta" id="suggestBtn">
          Suggest a spot
        </button>
      </section>

      <section
        class="result"
        id="result"
        aria-live="polite"
        aria-atomic="true"
        hidden
      >
        <p class="result__kicker">Try this</p>
        <h2 class="result__place" id="resultPlace"></h2>
        <dl class="result__meta">
          <div>
            <dt>Cuisine</dt>
            <dd id="resultCuisine"></dd>
          </div>
          <div>
            <dt>Area</dt>
            <dd id="resultLocation"></dd>
          </div>
          <div>
            <dt>Hours</dt>
            <dd id="resultHours"></dd>
          </div>
          <div>
            <dt>Closed</dt>
            <dd id="resultClosed"></dd>
          </div>
        </dl>
        <button type="button" class="again" id="againBtn">
          Suggest another
        </button>
      </section>

      <p class="empty" id="empty" hidden>
        Nothing matches those filters. Loosen the day, time, area, or cuisine
        and try again.
      </p>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
