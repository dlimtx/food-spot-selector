<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7d6e0" />
    <meta
      name="description"
      content="Find matching food spots by day, time, location, cuisine, and dish."
    />
    <title>Eat Where</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="app" id="app">
      <header class="brand">
        <p class="brand__mark">Eat Where</p>
        <h1 class="brand__headline">Hungry? Let’s settle it.</h1>
        <p class="brand__sub">
          Pick a day, time, area, cuisine, and dish — we’ll list every matching
          spot.
        </p>
      </header>

      <form class="gate-form" id="gateForm" aria-label="Password required">
        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <p class="gate-error" id="gateError" hidden>Wrong password. Try again.</p>
        <button type="submit" class="cta">Unlock</button>
      </form>

      <section class="picker" id="picker" aria-label="Food spot filters" hidden>
        <div class="field">
          <label for="day">Day</label>
          <select id="day" name="day"></select>
        </div>

        <div class="field">
          <label for="time">Time</label>
          <select id="time" name="time"></select>
        </div>

        <div class="field">
          <label for="location">Location</label>
          <select id="location" name="location"></select>
        </div>

        <div class="field">
          <label for="cuisine">Cuisine</label>
          <select id="cuisine" name="cuisine"></select>
        </div>

        <div class="field">
          <label for="dish">Dish</label>
          <select id="dish" name="dish"></select>
        </div>

        <p class="day-note" id="dayNote" hidden></p>

        <button type="button" class="cta" id="suggestBtn">
          Show matching spots
        </button>
      </section>

      <section class="results" id="result" aria-live="polite" hidden>
        <p class="result__kicker" id="resultKicker"></p>
        <ul class="result-list" id="resultList"></ul>
      </section>

      <p class="empty" id="empty" hidden>
        Nothing matches those filters. Loosen the day, time, area, cuisine, or
        dish and try again.
      </p>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
